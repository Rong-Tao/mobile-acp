<!DOCTYPE html>

<head>
<meta charset="UTF-8" />

<title>mobile-acp</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  * { box-sizing: border-box; -webkit-font-smoothing: antialiased; }
  html, body { margin: 0; padding: 0; height: 100%; background: #1a1b1e; overscroll-behavior: none; }
  #root { height: 100%; }
  input, textarea { font-family: inherit; }
  input::placeholder, textarea::placeholder { color: #6c7382; }
  ::-webkit-scrollbar { width: 0; height: 0; }
  * { scrollbar-width: none; }
  @keyframes acp-spin { to { transform: rotate(360deg); } }
  @keyframes acp-fade { from { opacity: 0; } to { opacity: 1; } }
  @keyframes acp-slideup { from { transform: translateY(100%); } to { transform: translateY(0); } }
  @keyframes acp-blink { 50% { opacity: 0; } }
  @keyframes acp-fadein { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
  @keyframes acp-slidein { from { transform: translateX(20px); } to { transform: none; } }
</style>
</head>
