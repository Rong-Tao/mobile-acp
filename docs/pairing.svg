  <rect x="32" y="44" width="192" height="12" fill="#1a1d24"/>
  <circle cx="52" cy="40" r="5" fill="#e5737f" opacity=".7"/>
  <circle cx="66" cy="40" r="5" fill="#d9b06a" opacity=".7"/>
  <circle cx="80" cy="40" r="5" fill="#6cd093" opacity=".7"/>
  <text x="128" y="43.5" fill="#6c7382" font-size="8.5" text-anchor="middle">Terminal</text>

  <g clip-path="url(#p1)">
    <rect x="32" y="56" width="192" height="260" fill="#0a0b0e"/>
    <!-- terminal output -->
    <text x="44" y="74" fill="#5fc4d0" font-size="8.5" font-weight="700" font-family="monospace">mobile-acp</text>
    <text x="105" y="74" fill="#a6acb9" font-size="8.5" font-family="monospace"> SSH key pairing</text>
    <text x="44" y="88" fill="#6c7382" font-size="8" font-family="monospace">Server : kai@10.0.0.5:22</text>
    <text x="44" y="99" fill="#6c7382" font-size="8" font-family="monospace">Pairing: port 2222 · 5 min</text>

    <!-- QR code (stylized) -->
    <!-- finder pattern top-left -->
    <rect x="68" y="112" width="42" height="42" rx="2" fill="#e7e9ee"/>
    <rect x="71" y="115" width="36" height="36" rx="1" fill="#0a0b0e"/>
    <rect x="74" y="118" width="30" height="30" rx="1" fill="#e7e9ee"/>
    <rect x="78" y="122" width="22" height="22" rx="1" fill="#0a0b0e"/>
    <rect x="81" y="125" width="16" height="16" fill="#e7e9ee"/>

    <!-- finder pattern top-right -->
    <rect x="146" y="112" width="42" height="42" rx="2" fill="#e7e9ee"/>
    <rect x="149" y="115" width="36" height="36" rx="1" fill="#0a0b0e"/>
    <rect x="152" y="118" width="30" height="30" rx="1" fill="#e7e9ee"/>
    <rect x="156" y="122" width="22" height="22" rx="1" fill="#0a0b0e"/>
    <rect x="159" y="125" width="16" height="16" fill="#e7e9ee"/>

    <!-- finder pattern bottom-left -->
    <rect x="68" y="190" width="42" height="42" rx="2" fill="#e7e9ee"/>
    <rect x="71" y="193" width="36" height="36" rx="1" fill="#0a0b0e"/>
    <rect x="74" y="196" width="30" height="30" rx="1" fill="#e7e9ee"/>
    <rect x="78" y="200" width="22" height="22" rx="1" fill="#0a0b0e"/>
    <rect x="81" y="203" width="16" height="16" fill="#e7e9ee"/>

    <!-- data cells (scattered) -->
    <rect x="116" y="112" width="5" height="5" fill="#e7e9ee"/>
    <rect x="124" y="112" width="5" height="5" fill="#e7e9ee"/>
    <rect x="120" y="119" width="5" height="5" fill="#e7e9ee"/>
    <rect x="116" y="126" width="8" height="5" fill="#e7e9ee"/>
    <rect x="128" y="126" width="5" height="5" fill="#e7e9ee"/>
    <rect x="116" y="133" width="5" height="5" fill="#e7e9ee"/>
    <rect x="124" y="133" width="8" height="5" fill="#e7e9ee"/>
    <rect x="116" y="140" width="8" height="5" fill="#e7e9ee"/>
    <rect x="128" y="140" width="5" height="5" fill="#e7e9ee"/>

    <rect x="116" y="190" width="5" height="5" fill="#e7e9ee"/>
    <rect x="128" y="190" width="8" height="5" fill="#e7e9ee"/>
    <rect x="120" y="197" width="8" height="5" fill="#e7e9ee"/>
    <rect x="116" y="204" width="5" height="5" fill="#e7e9ee"/>
    <rect x="126" y="204" width="5" height="5" fill="#e7e9ee"/>
    <rect x="116" y="211" width="8" height="5" fill="#e7e9ee"/>
    <rect x="128" y="211" width="5" height="5" fill="#e7e9ee"/>
    <rect x="116" y="218" width="5" height="5" fill="#e7e9ee"/>
    <rect x="124" y="218" width="8" height="5" fill="#e7e9ee"/>

    <rect x="148" y="158" width="5" height="5" fill="#e7e9ee"/>
