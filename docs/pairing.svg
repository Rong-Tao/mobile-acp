<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 340" font-family="'SF Pro Display','Inter',system-ui,sans-serif">
  <defs>
    <clipPath id="p1"><rect x="32" y="24" width="192" height="292" rx="22"/></clipPath>
    <clipPath id="p2"><rect x="334" y="24" width="192" height="292" rx="22"/></clipPath>
    <clipPath id="p3"><rect x="636" y="24" width="192" height="292" rx="22"/></clipPath>
    <filter id="sh"><feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#000" flood-opacity=".5"/></filter>
    <!-- QR pattern via tiny rects in a 9x9 grid (simplified) -->
  </defs>

  <rect width="860" height="340" fill="#09090c"/>

  <!-- arrows between phones -->
  <line x1="228" y1="170" x2="330" y2="170" stroke="#272b34" stroke-width="1.5" stroke-dasharray="4,3"/>
  <polygon points="330,165 338,170 330,175" fill="#272b34"/>
  <line x1="530" y1="170" x2="632" y2="170" stroke="#272b34" stroke-width="1.5" stroke-dasharray="4,3"/>
  <polygon points="632,165 640,170 632,175" fill="#272b34"/>

  <!-- step labels on arrows -->
  <text x="279" y="159" fill="#6c7382" font-size="9" text-anchor="middle">scan QR</text>
  <text x="581" y="159" fill="#6c7382" font-size="9" text-anchor="middle">POST pubkey</text>
  <text x="581" y="170" fill="#6c7382" font-size="9" text-anchor="middle">→ authorized_keys</text>


  <!-- ══════════════ PHONE 1 — server terminal QR ══════════════ -->
  <g filter="url(#sh)">
    <rect x="32" y="24" width="192" height="292" rx="22" fill="#0a0b0e" stroke="#272b34" stroke-width="1.5"/>
  </g>
  <!-- terminal chrome -->
