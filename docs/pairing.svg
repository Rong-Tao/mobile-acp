    <text x="44" y="268" fill="#a6acb9" font-size="8" font-family="monospace">⠹ Waiting… (4:31)</text>
  </g>

  <rect x="32" y="24" width="192" height="292" rx="22" fill="none" stroke="#3a3f4a" stroke-width="1.5"/>
  <text x="128" y="330" fill="#6c7382" font-size="10" text-anchor="middle">① Server runs CLI</text>


  <!-- ══════════════ PHONE 2 — camera viewfinder ══════════════ -->
  <g filter="url(#sh)">
    <rect x="334" y="24" width="192" height="292" rx="22" fill="#14161b" stroke="#272b34" stroke-width="1.5"/>
  </g>
  <rect x="394" y="30" width="72" height="14" rx="7" fill="#0d0e12"/>

  <g clip-path="url(#p2)">
    <rect x="334" y="24" width="192" height="40" fill="#14161b"/>
    <text x="346" y="54" fill="#a6acb9" font-size="14">‹</text>
    <text x="430" y="53" fill="#e7e9ee" font-size="13" text-anchor="middle" font-weight="600">Add server</text>
    <rect x="334" y="64" width="192" height="1" fill="#1d2129"/>

    <!-- seg control -->
    <rect x="346" y="74" width="168" height="26" rx="9" fill="#22262f"/>
    <rect x="348" y="76" width="82" height="22" rx="7" fill="#6aa6ff"/>
    <text x="389" y="91" fill="#0a1220" font-size="10.5" text-anchor="middle" font-weight="600">Scan QR</text>
    <text x="471" y="91" fill="#6c7382" font-size="10.5" text-anchor="middle">Manual</text>
    <rect x="334" y="100" width="192" height="1" fill="#1d2129"/>

    <text x="430" y="118" fill="#a6acb9" font-size="9" text-anchor="middle">Run on your server, scan the QR</text>

    <!-- code block -->
    <rect x="344" y="124" width="168" height="20" rx="6" fill="#0a0b0e" stroke="#1d2129" stroke-width="1"/>
    <text x="353" y="138" fill="#6aa6ff" font-size="8.5" font-family="monospace">$</text>
    <text x="361" y="138" fill="#a6acb9" font-size="8.5" font-family="monospace">npx -y mobile-acp-setup</text>

    <!-- camera viewfinder -->
    <rect x="355" y="152" width="150" height="130" rx="12" fill="#000" stroke="#6aa6ff" stroke-width="2"/>
    <!-- camera feed simulation -->
    <rect x="355" y="152" width="150" height="130" rx="12" fill="#111418"/>
    <!-- corner markers -->
    <path d="M367,164 L367,157 L374,157" fill="none" stroke="#6aa6ff" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M493,164 L493,157 L486,157" fill="none" stroke="#6aa6ff" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M367,270 L367,277 L374,277" fill="none" stroke="#6aa6ff" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M493,270 L493,277 L486,277" fill="none" stroke="#6aa6ff" stroke-width="2.5" stroke-linecap="round"/>

    <!-- scan line animation suggestion -->
    <line x1="358" y1="217" x2="502" y2="217" stroke="#6aa6ff" stroke-width="1" opacity=".5"/>

    <!-- mini QR visible in viewfinder -->
    <rect x="395" y="182" width="70" height="70" rx="2" fill="#e7e9ee" opacity=".9"/>
    <rect x="398" y="185" width="28" height="28" rx="1" fill="#111418"/>
    <rect x="401" y="188" width="22" height="22" rx="1" fill="#e7e9ee" opacity=".9"/>
    <rect x="404" y="191" width="16" height="16" fill="#111418"/>
    <rect x="407" y="194" width="10" height="10" fill="#e7e9ee" opacity=".9"/>
    <rect x="432" y="185" width="28" height="28" rx="1" fill="#111418"/>
    <rect x="435" y="188" width="22" height="22" rx="1" fill="#e7e9ee" opacity=".9"/>
    <rect x="438" y="191" width="16" height="16" fill="#111418"/>
    <rect x="441" y="194" width="10" height="10" fill="#e7e9ee" opacity=".9"/>
    <rect x="398" y="219" width="28" height="28" rx="1" fill="#111418"/>
    <rect x="401" y="222" width="22" height="22" rx="1" fill="#e7e9ee" opacity=".9"/>
    <rect x="404" y="225" width="16" height="16" fill="#111418"/>
    <rect x="407" y="228" width="10" height="10" fill="#e7e9ee" opacity=".9"/>

    <text x="430" y="295" fill="#6c7382" font-size="8.5" text-anchor="middle" font-family="monospace">Code valid for 5 minutes</text>
  </g>

  <rect x="334" y="24" width="192" height="292" rx="22" fill="none" stroke="#3a3f4a" stroke-width="1.5"/>
  <text x="430" y="330" fill="#6c7382" font-size="10" text-anchor="middle">② App scans QR</text>


  <!-- ══════════════ PHONE 3 — paired! ══════════════ -->
  <g filter="url(#sh)">
    <rect x="636" y="24" width="192" height="292" rx="22" fill="#14161b" stroke="#272b34" stroke-width="1.5"/>
  </g>
  <rect x="696" y="30" width="72" height="14" rx="7" fill="#0d0e12"/>

  <g clip-path="url(#p3)">
    <rect x="636" y="24" width="192" height="40" fill="#14161b"/>
    <text x="648" y="54" fill="#a6acb9" font-size="14">‹</text>
    <text x="732" y="53" fill="#e7e9ee" font-size="13" text-anchor="middle" font-weight="600">Add server</text>
    <rect x="636" y="64" width="192" height="1" fill="#1d2129"/>

    <!-- seg -->
    <rect x="648" y="74" width="168" height="26" rx="9" fill="#22262f"/>
    <rect x="650" y="76" width="82" height="22" rx="7" fill="#6aa6ff"/>
    <text x="691" y="91" fill="#0a1220" font-size="10.5" text-anchor="middle" font-weight="600">Scan QR</text>
    <text x="773" y="91" fill="#6c7382" font-size="10.5" text-anchor="middle">Manual</text>
    <rect x="636" y="100" width="192" height="1" fill="#1d2129"/>

    <!-- scanned confirmation card -->
    <rect x="648" y="116" width="166" height="52" rx="11" fill="#1a1d24" stroke="#272b34" stroke-width="1"/>
    <rect x="659" y="127" width="28" height="28" rx="8" fill="#6aa6ff22" stroke="#6aa6ff44" stroke-width="1"/>
    <text x="673" y="145" fill="#6aa6ff" font-size="14" text-anchor="middle">✓</text>
    <text x="697" y="134" fill="#e7e9ee" font-size="11" font-weight="600">kai@10.0.0.5</text>
    <text x="697" y="147" fill="#6c7382" font-size="9" font-family="monospace">SSH port 22</text>
    <!-- X button -->
    <text x="800" y="138" fill="#6c7382" font-size="11" text-anchor="middle">×</text>

    <!-- pairing button - success state -->
    <rect x="648" y="180" width="166" height="40" rx="11" fill="#6cd093"/>
    <text x="731" y="197" fill="#06140d" font-size="11" text-anchor="middle" font-weight="700">✓</text>
    <text x="731" y="212" fill="#06140d" font-size="11" text-anchor="middle" font-weight="600">Connected!</text>

    <!-- info text -->
    <text x="731" y="240" fill="#6c7382" font-size="8.5" text-anchor="middle">Ed25519 key added to</text>
    <text x="731" y="252" fill="#6c7382" font-size="8.5" text-anchor="middle" font-family="monospace">~/.ssh/authorized_keys</text>

    <!-- navigating indicator -->
    <rect x="648" y="266" width="166" height="30" rx="10" fill="#22262f" stroke="#1d2129" stroke-width="1"/>
    <text x="731" y="285" fill="#6cd093" font-size="9" text-anchor="middle">Opening devbox…</text>
  </g>

  <rect x="636" y="24" width="192" height="292" rx="22" fill="none" stroke="#3a3f4a" stroke-width="1.5"/>
  <text x="732" y="330" fill="#6c7382" font-size="10" text-anchor="middle">③ Paired &amp; ready</text>
</svg>
