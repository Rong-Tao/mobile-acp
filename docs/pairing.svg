    <rect x="170" y="158" width="5" height="5" fill="#e7e9ee"/>
    <rect x="148" y="165" width="8" height="5" fill="#e7e9ee"/>
    <rect x="162" y="165" width="5" height="5" fill="#e7e9ee"/>
    <rect x="170" y="165" width="5" height="5" fill="#e7e9ee"/>
    <rect x="148" y="172" width="5" height="5" fill="#e7e9ee"/>
    <rect x="158" y="172" width="8" height="5" fill="#e7e9ee"/>
    <rect x="170" y="172" width="5" height="5" fill="#e7e9ee"/>
    <rect x="148" y="179" width="8" height="5" fill="#e7e9ee"/>
    <rect x="162" y="179" width="5" height="5" fill="#e7e9ee"/>

    <rect x="68" y="158" width="5" height="5" fill="#e7e9ee"/>
    <rect x="78" y="158" width="8" height="5" fill="#e7e9ee"/>
    <rect x="90" y="158" width="5" height="5" fill="#e7e9ee"/>
    <rect x="100" y="158" width="5" height="5" fill="#e7e9ee"/>
    <rect x="68" y="165" width="8" height="5" fill="#e7e9ee"/>
    <rect x="82" y="165" width="5" height="5" fill="#e7e9ee"/>
    <rect x="92" y="165" width="8" height="5" fill="#e7e9ee"/>
    <rect x="68" y="172" width="5" height="5" fill="#e7e9ee"/>
    <rect x="76" y="172" width="8" height="5" fill="#e7e9ee"/>
    <rect x="90" y="172" width="5" height="5" fill="#e7e9ee"/>
    <rect x="100" y="172" width="5" height="5" fill="#e7e9ee"/>
    <rect x="68" y="179" width="8" height="5" fill="#e7e9ee"/>
    <rect x="80" y="179" width="5" height="5" fill="#e7e9ee"/>
    <rect x="92" y="179" width="8" height="5" fill="#e7e9ee"/>

    <text x="128" y="252" fill="#6c7382" font-size="7.5" text-anchor="middle" font-family="monospace">Scan with mobile-acp app</text>
